name: GitHub Activity Dashboard CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  # JOB 1: Backend CI (Python)
  backend-ci:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Preuzimanje koda
        uses: actions/checkout@v4

      - name: Podešavanje Python okruženja
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalacija backend zavisnosti
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Pokretanje pytest testova
        run: |
          cd backend
          python -m pytest -v

  # JOB 2: Frontend CI (Build check)
  frontend-ci:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Preuzimanje koda
        uses: actions/checkout@v4

      - name: Podešavanje Node.js okruženja
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalacija frontend zavisnosti
        run: |
          cd frontend
          npm install

      - name: Provera frontend build-a
        run: |
          cd frontend
          CI=false npm run build --if-present

  # JOB 3: Docker Container Build Check
  docker-build:
    name: Build Docker Container
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Preuzimanje koda
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Testiranje izrade Docker imidža
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: github-activity-dashboard:latest