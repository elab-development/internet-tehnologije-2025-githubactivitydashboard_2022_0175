name: GitHub Activity Dashboard CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  # JOB 1: Backend CI (Python)
  backend-ci:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Preuzimanje koda
        uses: actions/checkout@v4

      - name: Podešavanje Python okruženja
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalacija backend zavisnosti
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Pokretanje pytest testova
        run: |
          cd backend
          python -m pytest -v

    # JOB 2: Frontend CI (Unit/Component tests, E2E tests, Build check)
  frontend-ci:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Preuzimanje koda
        uses: actions/checkout@v4

      - name: Podešavanje Node.js okruženja
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalacija frontend zavisnosti
        run: |
          cd frontend
          npm ci

      - name: Pokretanje Jest unit i komponentnih testova
        run: |
          cd frontend
          CI=true npm test -- --watchAll=false

      - name: Instalacija Playwright browsera
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Pokretanje Playwright E2E testova
        run: |
          cd frontend
          npm run test:e2e

      - name: Čuvanje Playwright izveštaja pri padu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Provera frontend build-a
        run: |
          cd frontend
          CI=false npm run build

  # JOB 3: Docker Container Build Check
  docker-build:
    name: Build Docker Container
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Preuzimanje koda
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Testiranje izrade Docker imidža
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: github-activity-dashboard:latest

  # JOB 4: Continuous Deployment na Render Cloud
  deploy:
    name: Deploy to Render Cloud
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Backend Deployment
        run: |
          curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Trigger Render Frontend Deployment
        run: |
          curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"